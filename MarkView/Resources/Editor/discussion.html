<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- The thread of a Discussion (DiscussionThreadView.swift): the conversation as a web page, each answer drawn in the
     form the question needs (text, table, Mermaid diagram, SVG, chart, styled figure).
     Swift → JS: mvSetTheme(dark), mvSetTurns(json), mvSetLive(json|null), mvScrollToEnd().
     JS → Swift (message handler "discussion"): {type: ready|save|ask}. AI text never runs as HTML: markdown-it has
     html disabled, SVG is sanitized, a styled figure is a sandboxed frame without scripts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-src about: data:; connect-src 'none'">
<style>
    :root { --bg: #1e1e1e; --fg: #d4d4d4; --dim: #808080; --card: #252526; --border: #3c3c3c; --accent: #569cd6; --user: #2a3a4d; --code: #2d2d30; }
    :root.light { --bg: #ffffff; --fg: #1f2328; --dim: #6e7681; --card: #f6f8fa; --border: #d0d7de; --accent: #0969da; --user: #ddf0ff; --code: #eef1f4; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.55 -apple-system, system-ui, sans-serif; }
    #thread { padding: 18px 22px 40px; max-width: 980px; margin: 0 auto; }
    .turn { margin-bottom: 22px; }
    .q { background: var(--user); border-radius: 10px; padding: 8px 12px; margin: 0 0 10px 40px; white-space: pre-wrap; }
    .who { font-size: 10px; letter-spacing: .06em; color: var(--dim); text-transform: uppercase; margin: 0 0 3px 2px; }
    .a > :first-child { margin-top: 0; }
    .a h1, .a h2, .a h3 { margin: 16px 0 6px; line-height: 1.25; }
    .a h1 { font-size: 18px; } .a h2 { font-size: 15px; } .a h3 { font-size: 13px; }
    .a p, .a ul, .a ol { margin: 6px 0; }
    .a code { background: var(--code); padding: 1px 4px; border-radius: 4px; font: 12px ui-monospace, Menlo, monospace; }
    .a pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
    .a pre code { background: none; padding: 0; }
    .a a { color: var(--accent); }
    .a table { border-collapse: collapse; margin: 10px 0; width: 100%; }
    .a th, .a td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
    .a th { background: var(--card); }
    .a blockquote { margin: 8px 0; padding: 2px 12px; border-left: 3px solid var(--accent); color: var(--dim); }
    figure.visual { position: relative; margin: 12px 0; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
    figure.visual svg { display: block; margin: 0 auto; max-width: min(100%, 680px); max-height: 440px; height: auto; }
    figure.visual[data-kind=mermaid] svg { max-width: 100%; max-height: none; }
    figure.visual canvas { max-height: 380px; }
    figure.visual iframe { width: 100%; height: 360px; border: 0; background: #fff; border-radius: 6px; resize: vertical; overflow: auto; }
    figure.visual .tools { position: absolute; top: 6px; right: 8px; opacity: 0; transition: opacity .15s; }
    figure.visual:hover .tools { opacity: 1; }
    .tools button { font: 11px system-ui; padding: 2px 8px; border-radius: 5px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
    .drawing, .status { color: var(--dim); font-size: 12px; }
    .status::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border: 2px solid var(--dim); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #f14c4c; }
    #empty { color: var(--dim); text-align: center; margin-top: 18vh; }
</style>
</head>
<body>
<div id="thread"></div>
<script src="vendor/js/markdown-it.min.js"></script>
<script src="vendor/js/mermaid.min.js"></script>
<script src="vendor/js/chart-4.4.9.min.js"></script>
<script src="vendor/js/markview-discussion.js"></script>
</body>
</html>
