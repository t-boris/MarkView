<!DOCTYPE html>
<html lang="en" data-preset="classic-dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      CSP applies document-wide (meta-tag granularity). Existing modes (preview,
      structured, WYSIWYG-save graph canvas) use locally vendored scripts and styles:
        - All scripts and styles under vendor/ (no external CDN hosts, AR-03)
        - Remote https <img> for user markdown image content
        - markview-doc: pictures a document refers to by a relative path (served by the app, BUG-061)
      DOMPurify sanitizes rendered Markdown HTML before DOM insertion and inline handlers
      are bound via listeners so script-src requires no 'unsafe-inline' (AR-01).

      Insight mode v2 isolates ALL LLM-rendered content inside an iframe
      (sandbox="allow-scripts", null-origin) with its own stricter CSP defined
      inside the iframe srcdoc (`default-src 'none'; script-src 'nonce-...'`
      (failing closed to `'none'` without a nonce); `style-src 'unsafe-inline';
      connect-src 'none'; img-src data: blob:; object-src 'none'; base-uri 'none';
      frame-ancestors 'none'`). The parent page never executes LLM-derived script.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' markview-data:; img-src 'self' data: https: markview-doc:; object-src 'none'; base-uri 'none'">
    <title>MarkView Editor</title>

    <!-- The app injects the bundle's theme and bridge section before first paint. -->

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="vendor/css/katex.min.css">

    <!-- Prism.js CSS -->
    <link rel="stylesheet" href="vendor/css/prism-okaidia.min.css">
    <link rel="stylesheet" href="vendor/css/prism-line-numbers.css">
    <link rel="stylesheet" href="vendor/css/prism-diff-highlight.css">
    <link rel="stylesheet" href="vendor/css/markview-canvas.css">

    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/process.css">
</head>
<body>
    <div class="editor-container">
        <!-- Hidden elements for JS compatibility -->
        <div class="editor-toolbar" style="display:none">
            <button id="btn-toggle-mode"></button>
        </div>

        <!-- Find Bar -->
        <div class="find-bar" id="find-bar">
            <input type="text" id="find-input" placeholder="Find..." spellcheck="false">
            <span class="find-count" id="find-count"></span>
            <button data-mv-action="findPrev" title="Previous (⇧Enter)">▲</button>
            <button data-mv-action="findNext" title="Next (Enter)">▼</button>
            <button id="find-case-btn" data-mv-action="toggleFindCase" title="Match Case" style="font-size: calc(11px * var(--ui-scale, 1));font-weight:bold;">Aa</button>
            <button id="find-regex-btn" data-mv-action="toggleFindRegex" title="Use Regex" style="font-size: calc(11px * var(--ui-scale, 1));font-family:monospace;">.*</button>
            <button data-mv-action="closeFind" title="Close (Esc)">✕</button>
        </div>

        <!-- WYSIWYG Toolbar -->
        <div class="wysiwyg-toolbar" id="wysiwyg-toolbar">
            <button data-mv-action="fmtCmd:bold" title="Bold (⌘B)"><b>B</b></button>
            <button data-mv-action="fmtCmd:italic" title="Italic (⌘I)"><i>I</i></button>
            <div class="sep"></div>
            <button data-mv-action="fmtBlock:H1" title="Heading 1" style="font-weight:800;font-size: calc(14px * var(--ui-scale, 1))">H1</button>
            <button data-mv-action="fmtBlock:H2" title="Heading 2" style="font-weight:700;font-size: calc(12px * var(--ui-scale, 1))">H2</button>
            <div class="sep"></div>
            <button data-mv-action="fmtCmd:insertUnorderedList" title="Bullet list">•&mdash;</button>
            <button data-mv-action="fmtLink" title="Insert link (⌘K)">🔗</button>
            <div class="spacer"></div>
            <button data-mv-action="saveFile" title="Save (⌘S)" style="font-size: calc(11px * var(--ui-scale, 1))">💾</button>
            <details class="editor-more">
                <summary title="More editor actions" aria-label="More editor actions" data-mv-prevent-mousedown="true">⋯</summary>
                <div class="editor-more-menu" data-mv-prevent-mousedown="true">
                    <span class="menu-heading">Formatting</span>
                    <button data-mv-action="fmtCmd:strikeThrough" title="Strikethrough"><s>S</s> Strike</button>
                    <button data-mv-action="fmtCmd:code" title="Inline code">&lt;/&gt; Code</button>
                    <button data-mv-action="fmtBlock:H3" title="Heading 3">H3 Heading</button>
                    <button data-mv-action="fmtCmd:insertOrderedList" title="Numbered list">1. List</button>
                    <button data-mv-action="fmtCmd:formatBlock:blockquote" title="Quote">❝ Quote</button>
                    <button data-mv-action="fmtCodeBlock" title="Code block">{ } Block</button>
                    <span class="menu-heading">Insert</span>
                    <button data-mv-action="fmtImage" title="Insert image">▧ Image</button>
                    <button data-mv-action="fmtHR" title="Horizontal rule">— Rule</button>
                    <button data-mv-action="fmtTable" title="Insert table">▦ Table</button>
                    <button data-mv-action="fmtMermaid" title="Insert a Mermaid diagram">◇ Diagram</button>
                    <span class="menu-heading">Document</span>
                    <button data-mv-action="refreshFile" title="Reload file from disk (⌘R)">↻ Reload</button>
                    <span class="menu-heading">Selection</span>
                    <button data-mv-action="selectionAction:translate_ru" title="Translate selection to Russian">RU Translate</button>
                    <button data-mv-action="selectionAction:translate_en" title="Translate selection to English">EN Translate</button>
                    <button data-mv-action="selectionAction:explain" title="Explain selection">? Explain</button>
                </div>
            </details>
            <span class="mode-label" id="mode-toggle" data-mv-action="toggleMode" title="Switch mode (⌘⇧P)">Source ↗</span>
        </div>

        <div class="editor-content">
            <!-- Hidden textarea — stores raw markdown, syncs with contentEditable -->
            <div class="editor-pane" id="editor-pane" style="display: none;">
                <textarea class="editor-input" id="editor-input"></textarea>
            </div>
            <!-- WYSIWYG editor — contentEditable rendered markdown -->
            <div class="editor-pane preview-only" id="preview-pane" style="display: flex;">
                <div class="editor-rendered" id="editor-rendered" contenteditable="true" spellcheck="true">
                    <div class="editor-empty">
                        <div class="editor-empty-content">
                            <div class="editor-empty-title">MarkView</div>
                            <div class="editor-empty-text">Open a file to begin</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recursive Insight mode v2 — sandboxed iframe + chrome (breadcrumbs/status) -->
            <!-- Iframe is dynamically inserted by JS so its sandbox attribute and srcdoc
                 are owned by the v2 loadInsightSkeleton flow. The static placeholder element
                 below is REPLACED on first load. -->
            <div class="insight-container" id="insight-container">
                <div class="insight-breadcrumbs" id="insight-breadcrumbs"></div>
                <iframe class="insight-iframe" id="insight-iframe" sandbox="allow-scripts" title="Insight content"></iframe>
                <div class="insight-status-bar" id="insight-status-bar"></div>
            </div>

            <!-- Read-only code viewer (markview-code.js + codemirror.bundle.js) -->
            <div class="code-container" id="code-container"></div>
            <div class="data-container" id="data-container"></div>

            <!-- Architecture tab (markview-architecture-*.js + cytoscape/elk) -->
            <div class="arch-container" id="arch-container">
                <div class="arch-toolbar">
                    <div class="arch-seg" role="tablist">
                        <button data-arch-view="code" title="Source code: layers, components, files, symbols and scenario sequences">Code</button>
                        <button data-arch-view="process" title="Source-grounded control flow with branches, parallel work and returns">Process</button>
                        <button data-arch-view="logical" class="on" title="Logical components (AI)">Logical</button>
                        <button data-arch-view="modules" title="Folders and files as they are on disk">Structure</button>
                        <button data-arch-view="deployment">Deployment</button>
                        <button data-arch-view="docs" title="The documents as a book: parts, chapters, sections and cross-references">Book</button>
                    </div>
                    <select id="arch-overlay" title="Colour the modules by">
                        <option value="none">No overlay</option>
                        <option value="coverage">Documentation</option>
                        <option value="tests">Tests</option>
                        <option value="bugs">Bug history</option>
                        <option value="freshness">Freshness</option>
                        <option value="complexity">Complexity</option>
                        <option value="size">Size</option>
                        <option value="pr">Pull request</option>
                    </select>
                    <form class="temp-filter" id="arch-temp-filter" title="AI search: the AI reads the project; what matters for it turns red, the rest stays uncoloured">
                        <input placeholder="⚡ AI search, e.g. how is a plant identified?"><button type="button" hidden title="Clear">✕</button>
                    </form>
                    <label class="arch-check" title="Hide everything the overlay does not flag"><input type="checkbox" id="arch-flagged"> Only flagged</label>
                    <select id="arch-hide" title="Hide by kind">
                        <option value="">Show all</option>
                        <option value="tests">Hide tests</option>
                        <option value="tests,config,build,generated">Hide tests, config, build</option>
                        <option value="tests,config,build,generated,docs,scripts,examples">Code only</option>
                    </select>
                    <button class="arch-btn" id="arch-pr-open" title="PR X-Ray: what a pull request changes in the architecture">⎇ Pull request</button>
                    <select id="arch-pr-source" hidden title="Change to show"></select>
                    <form class="temp-filter" id="arch-pr-number" hidden title="Any pull request by number or GitHub link, also merged or closed ones">
                        <input placeholder="PR # or link" style="width: 110px">
                    </form>
                    <div class="arch-seg" id="arch-pr-map" role="tablist" hidden>
                        <button data-arch-pr-map="focused" class="on" title="Only the parts the change touches, with the context they need">Focused</button>
                        <button data-arch-pr-map="full" title="The whole architecture with the changes highlighted">Full map</button>
                    </div>
                    <button class="arch-btn" id="arch-pr-date" hidden title="Compare the working copy with a commit made on an earlier day">Compare with a date…</button>
                    <button class="arch-btn" id="arch-analyze-pr" hidden title="AI: architectural impact of this change">Analyze PR</button>
                    <button class="arch-btn" id="arch-review" hidden>Review with AI</button>
                    <span class="arch-spacer"></span>
                    <span id="arch-status"></span>
                    <!-- Kept together: when the toolbar is narrow the group moves to the next line as a whole. -->
                    <div class="arch-actions">
                        <button class="arch-btn" id="arch-deploy" hidden title="Run a discovered deployment operation">Deploy</button>
                        <select id="arch-deploy-picker" hidden aria-label="Choose deployment operation"></select>
                        <button class="arch-btn" id="arch-code-trace" hidden title="Trace a code scenario as a sequence diagram">Sequence…</button>
                        <button class="arch-btn" id="arch-analyze" title="Describe modules and map deployment with the selected AI assistant">Analyze</button>
                        <button class="arch-btn" id="arch-rescan" title="Scan the folder again (no AI)" aria-label="Rescan">↻</button>
                        <button class="arch-btn" id="arch-fit" title="Fit to window" aria-label="Fit to window">⛶</button>
                        <button class="arch-btn" id="arch-details-toggle" title="Show or hide the details panel" aria-label="Toggle details">▤</button>
                    </div>
                </div>
                <div class="arch-progress" id="arch-progress" hidden>
                    <div class="arch-progress-steps"></div>
                    <div class="arch-progress-text">
                        <span class="arch-progress-title"></span>
                        <span class="arch-progress-stats"></span>
                        <span class="arch-progress-current"></span>
                    </div>
                    <button class="arch-btn" id="arch-stop" title="Stop the analysis; finished steps are kept">Stop</button>
                </div>
                <div class="arch-crumbs" id="arch-crumbs"></div>
                <div class="arch-main">
                    <section id="arch-process" class="arch-process" hidden aria-label="Process map"></section>
                    <div class="arch-graph-wrap">
                        <div class="arch-graph" id="arch-graph"></div>
                        <div class="arch-empty" id="arch-empty" hidden></div>
                        <!-- PR X-Ray: pick a day, then one of its commits, to compare the working copy with. -->
                        <section class="arch-history" id="arch-history" hidden aria-label="Compare with a commit from an earlier day">
                            <label for="arch-history-day">Commits made on</label>
                            <input type="date" id="arch-history-day">
                            <div class="arch-history-list" id="arch-history-list"></div>
                        </section>
                        <section id="arch-code-sequence" class="arch-code-sequence" hidden aria-label="Code sequence diagram">
                            <div class="arch-toolbar"><strong id="arch-code-sequence-title"></strong><button class="arch-btn" id="arch-code-sequence-close">Back to layers</button></div>
                            <p id="arch-code-sequence-takeaway"></p>
                            <div id="arch-code-sequence-svg"></div>
                            <p id="arch-code-sequence-omitted" class="arch-muted"></p>
                            <div id="arch-code-sequence-sources"></div>
                        </section>
                    </div>
                    <div class="mv-resizer" id="arch-details-resizer"></div>
                    <div class="arch-details" id="arch-details"></div>
                </div>
                <div class="arch-legend" id="arch-legend"></div>
            </div>
        </div>

        <!-- Floating format toolbar — appears on text selection -->
        <div class="format-bar" id="format-bar">
            <button data-mv-action="fmtCmd:bold" title="Bold (⌘B)"><b>B</b></button>
            <button data-mv-action="fmtCmd:italic" title="Italic (⌘I)"><i>I</i></button>
            <button data-mv-action="fmtCmd:strikeThrough" title="Strikethrough"><s>S</s></button>
            <button data-mv-action="fmtCmd:code" title="Inline code">⟨⟩</button>
            <div class="sep"></div>
            <button data-mv-action="fmtHeading" title="Heading">H</button>
            <button data-mv-action="fmtCmd:insertUnorderedList" title="Bullet list">•</button>
            <button data-mv-action="fmtCmd:insertOrderedList" title="Numbered list">1.</button>
            <button data-mv-action="fmtLink" title="Link">🔗</button>
            <button data-mv-action="fmtCmd:formatBlock:blockquote" title="Quote">❝</button>
            <div class="sep"></div>
            <button data-mv-prevent-mousedown="true" data-mv-action="selectionAction:translate_ru" title="Translate to Russian" style="font-size: calc(10px * var(--ui-scale, 1))">RU</button>
            <button data-mv-prevent-mousedown="true" data-mv-action="selectionAction:translate_en" title="Translate to English" style="font-size: calc(10px * var(--ui-scale, 1))">EN</button>
            <button data-mv-prevent-mousedown="true" data-mv-action="selectionAction:explain" title="Explain selection" style="font-size: calc(10px * var(--ui-scale, 1))">?</button>
            <div class="sep"></div>
            <button data-mv-prevent-mousedown="true" data-mv-action="showFeatureMenu" title="Feature actions (AI): challenge, requirements, decisions…" style="font-size: calc(12px * var(--ui-scale, 1))">✦</button>
        </div>

        <!-- Feature actions on the selection (results go to the Feature tab) -->
        <div class="feature-menu" id="feature-menu">
            <input id="feature-ask" type="text" placeholder="Ask AI about the selection…" spellcheck="false">
            <div class="feature-menu-item" id="feature-comment" style="display:none" data-mv-action="featureAction:comment"
                 title="Research document: the AI reworks the section around the selection according to your comment">Revise With Comment</div>
            <div class="feature-menu-sep" id="feature-comment-sep" style="display:none"></div>
            <div class="feature-menu-item" data-mv-action="featureAction:challenge">Challenge</div>
            <div class="feature-menu-item" data-mv-action="featureAction:expand">Expand</div>
            <div class="feature-menu-item" data-mv-action="featureAction:research">Research</div>
            <div class="feature-menu-item" data-mv-action="featureAction:edgeCases">Find Edge Cases</div>
            <div class="feature-menu-item" data-mv-action="featureAction:contradictions">Find Contradictions</div>
            <div class="feature-menu-item" data-mv-action="featureAction:related">Find Related Documentation</div>
            <div class="feature-menu-item" data-mv-action="featureAction:explain">Explain</div>
            <div class="feature-menu-item" data-mv-action="featureAction:diagram">Generate Diagram</div>
            <div class="feature-menu-sep"></div>
            <div class="feature-menu-item" data-mv-action="featureAction:requirement">Turn Into Requirement</div>
            <div class="feature-menu-item" data-mv-action="featureAction:decision">Create Decision</div>
            <div class="feature-menu-item" data-mv-action="featureAction:question">Create Question</div>
        </div>

        <!-- Selection action popup overlay -->
        <div class="action-popup" id="action-popup">
            <div class="action-popup-header">
                <span class="action-popup-title" id="action-popup-title">Result</span>
                <button class="action-popup-close" data-mv-action="closeActionPopup">✕</button>
            </div>
            <div class="action-popup-content" id="action-popup-content"></div>
        </div>
        <div class="action-popup-backdrop" id="action-popup-backdrop" data-mv-action="closeActionPopup"></div>

        <!-- Compact status bar -->
        <div class="editor-status">
            <div class="status-item">
                <span id="status-words"></span>
                <span id="status-chars"></span>
                <span id="status-mode" style="display:none">Preview</span>
            </div>
            <div class="status-item">
                <div id="toc-status"></div>
                <div class="font-slider-wrap">
                    <label>A</label>
                    <input type="range" class="font-slider" id="font-slider" min="10" max="20" value="13" step="0.5" title="Font size">
                    <label style="font-size: calc(13px * var(--ui-scale, 1))">A</label>
                </div>
            </div>
        </div>
    </div>

    <!-- markdown-it library -->
    <script src="vendor/js/markdown-it.min.js"></script>

    <!-- markdown-it plugins -->
    <script src="vendor/js/markdown-it-footnote.min.js"></script>
    <script src="vendor/js/markdown-it-task-lists.min.js"></script>
    <script src="vendor/js/markdown-it-container.min.js"></script>

    <!-- Mermaid -->
    <script src="vendor/js/mermaid.min.js"></script>

    <!-- KaTeX -->
    <script src="vendor/js/katex.min.js"></script>
    <script src="vendor/js/auto-render.min.js"></script>

    <!-- D3.js (bundled, no CDN) for the interactive mermaid canvas; ELK is loaded on first use -->
    <script src="vendor/js/d3.min.js"></script>

    <!-- DOMPurify: Markdown HTML sanitizer (AR-01) -->
    <script src="vendor/js/dompurify.min.js"></script>

    <!-- Turndown: HTML → Markdown (for WYSIWYG save, vendored locally per AR-03) -->
    <script src="vendor/js/turndown.min.js"></script>
    <script src="vendor/js/turndown-plugin-gfm.min.js"></script>

    <!-- Prism.js -->
    <script src="vendor/js/prism.min.js"></script>
    <script src="vendor/js/prism-line-numbers.min.js"></script>

    <!-- Language support for Prism -->
    <script src="vendor/js/prism-typescript.min.js"></script>
    <script src="vendor/js/prism-python.min.js"></script>
    <script src="vendor/js/prism-swift.min.js"></script>
    <script src="vendor/js/prism-rust.min.js"></script>
    <script src="vendor/js/prism-go.min.js"></script>
    <script src="vendor/js/prism-java.min.js"></script>
    <script src="vendor/js/prism-c.min.js"></script>
    <script src="vendor/js/prism-cpp.min.js"></script>
    <script src="vendor/js/prism-bash.min.js"></script>
    <script src="vendor/js/prism-json.min.js"></script>
    <script src="vendor/js/prism-yaml.min.js"></script>
    <script src="vendor/js/prism-html.min.js"></script>
    <script src="vendor/js/prism-css.min.js"></script>
    <script src="vendor/js/prism-sql.min.js"></script>
    <script src="vendor/js/prism-markdown.min.js"></script>

    <!-- YAML parser for structured data view -->
    <script src="vendor/js/js-yaml.min.js"></script>

    <!-- The generated classic-script bundle retains the ordered inputs and their shared globals. -->
    <!-- markview-canvas.js wraps window.setContent / window.scrollToHeading — must
         load AFTER markview-bridge.js and markview-globals.js define them. -->
    <!-- markview-code.js wraps setContent / setStructuredContent / setTheme — load
         after everything that defines or wraps them. -->
    <!-- markview-data.js wraps setContent / setStructuredContent / setCodeContent: load after them. -->
    <!-- The research map (type: research-map documents) also wraps setContent / the entry points of the other views and
         switchToSource / switchToPreview / the mode toggles: load it after markview-data.js. The layout engine comes first, then the
         six parts of the map in order (they share window.MVResearchMapView). -->
    <script src="js/editor.bundle.js"></script>
</body>
</html>
