<!DOCTYPE html>
<html lang="en" data-preset="classic-dark" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'">
<!-- An embedded terminal (TerminalSession.swift): xterm.js drawing a PTY that Swift owns.
     Swift → JS: mvWrite(base64 output), mvSetTheme(id, accent), mvFocus(), mvReset(), mvExited(code).
     JS → Swift (message handler "terminal"): {type: ready|input|resize|link|resolveLinks|pasteFiles, …}. -->
<link rel="stylesheet" href="vendor/css/xterm.css">
<script src="js/markview-themes.js"></script>
<script src="js/mv-kit.js"></script>
<script src="vendor/js/xterm.bundle.js"></script>
<script src="js/markview-terminal.js"></script>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg-primary); }
    #term { position: absolute; inset: 6px 4px 4px 8px; }
    #truncated { position: absolute; z-index: 2; top: 0; left: 0; right: 0; padding: 3px 8px;
        background: #67431b; color: #fff; font: 11px system-ui; }
    .xterm .xterm-viewport { background-color: transparent !important; }
    /* WebKit rounds inline glyph advances differently from xterm's row width.
       Allow a cell of paint room in FitAddon's existing right-side gutter,
       so the row's overflow:hidden does not shave the final glyph at DPR 1. */
    .xterm .xterm-rows > div { padding-right: 8px; }
</style>
</head>
<body>
<div id="term"></div>
<div id="truncated" hidden>Earlier output was dropped from the 10,000-line scrollback.</div>
</body>
</html>
