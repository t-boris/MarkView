# Compiles the Release configuration on every push to main. It publishes nothing: the only installer on GitHub is the
# signed, notarized DMG of a release made by ./release.sh --publish (or publish-release.yml).
name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/build-release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      # The image's default Xcode, as in the pull request checks; the log records which one built the app.
      - name: Show Xcode
        run: xcodebuild -version

      # Build each architecture on its own runner. Incremental compilation retains
      # Release optimization while allowing Swift to compile files in parallel.
      # The published installer still uses the project's whole-module settings.
      - name: Build Release (${{ matrix.arch }})
        run: |
          xcodebuild -scheme MarkView \
            -destination 'platform=macOS' \
            -configuration Release \
            -jobs 5 \
            ARCHS=${{ matrix.arch }} \
            SWIFT_COMPILATION_MODE=incremental \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION=YES \
            build
