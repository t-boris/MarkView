# Compiles the Release configuration on every push to main. It publishes nothing: the only installer on GitHub is the
# signed, notarized DMG of a release made by ./release.sh --publish (or publish-release.yml).
name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Build Release
        run: |
          xcodebuild -scheme MarkView \
            -destination 'platform=macOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION=YES \
            build
