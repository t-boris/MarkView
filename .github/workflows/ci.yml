# Unified CI workflow (AR-45, DEC-008):
# - Cancels superseded runs on the same ref (`concurrency.cancel-in-progress: true`)
# - Runs `swift test` on `Packages/MarkViewCore` (AR-44)
# - Runs the architecture lint (`tools/lint/architecture-lint.sh`) and the manifest-selected suites (`tools/tests/run.sh`)
# - Compiles the macOS app once with a shared DerivedData cache (`tools/ci/build-cache-mtimes.py`)
# - Keeps the compiler warnings of the package and of the app at the allowance of `tools/lint/build-warnings-allowlist.txt` (AR-43)
name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'tasks/**'
      - '*.md'
      - 'MarkView-Presentation.*'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tasks/**'
      - '*.md'
      - 'MarkView-Presentation.*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pure-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Architecture lint
        run: ./tools/lint/architecture-lint.sh

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint ratchet
        run: ./tools/lint/swiftlint-ratchet.py

      - name: Run pure regression test suite
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          suites=$(python3 tools/ci/pure-test-shards.py "$SHARD")
          test -n "$suites"
          ./tools/tests/run.sh --tier pure $suites

  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Run MarkViewCore Swift Package tests
        run: |
          set -o pipefail
          swift test --package-path Packages/MarkViewCore 2>&1 | tee "$RUNNER_TEMP/package-build.log"

      - name: Run headless WebKit & window session regression suites
        run: |
          bash tools/tests/phase0-safety-tests.sh
          bash tools/tests/window-session-tests.sh

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/MarkViewDerivedData
          key: markview-debug-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-${{ hashFiles('MarkView/**', 'Packages/MarkViewCore/**', 'MarkView.xcodeproj/**') }}
          restore-keys: |
            markview-debug-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-

      - name: Restore unchanged build input timestamps
        run: python3 tools/ci/build-cache-mtimes.py restore "$RUNNER_TEMP/MarkViewDerivedData/source-mtimes.json"

      - name: Build MarkView (Debug)
        run: |
          set -o pipefail
          xcodebuild -project MarkView.xcodeproj \
            -scheme MarkView \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/MarkViewDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/app-build.log"

      - name: Build warnings ratchet
        run: ./tools/lint/build-warnings.sh --log "$RUNNER_TEMP/app-build.log" --log "$RUNNER_TEMP/package-build.log"

      - name: Record build input timestamps
        run: python3 tools/ci/build-cache-mtimes.py save "$RUNNER_TEMP/MarkViewDerivedData/source-mtimes.json"

      - name: Save build cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/MarkViewDerivedData
          key: ${{ steps.cache.outputs.cache-primary-key }}
