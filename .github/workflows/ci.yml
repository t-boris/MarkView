# Unified CI workflow (AR-45, DEC-008):
# - Cancels superseded runs on the same ref (`concurrency.cancel-in-progress: true`)
# - Runs `swift test` on `Packages/MarkViewCore` (AR-44)
# - Runs the architecture lint (`tools/lint/architecture-lint.sh`) and the manifest-selected suites (`tools/tests/run.sh`)
# - Compiles the macOS app once with a shared DerivedData cache (`tools/ci/build-cache-mtimes.py`)
# - Keeps the compiler warnings of the package and of the app at the allowance of `tools/lint/build-warnings-allowlist.txt` (AR-43)
name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'tasks/**'
      - '*.md'
      - 'MarkView-Presentation.*'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tasks/**'
      - '*.md'
      - 'MarkView-Presentation.*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-bundle:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/web-vendor/package-lock.json
      - name: Rebuild shipped web bundles
        working-directory: tools/web-vendor
        run: |
          npm ci
          npm run check:editor
          ./build.sh
          git diff --exit-code -- ../../MarkView/Resources/Editor
      - name: Check research map layout and UI Studio Node behavior
        run: ./tools/tests/run.sh --jobs 2 research-map-layout-tests ui-studio-node-tests

  pure-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    # The architecture-lint fixture uses Apple's plutil; the other pure shards
    # need only standard shell, Python and Node and need not queue for macOS.
    runs-on: ${{ matrix.shard == 0 && 'macos-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: matrix.shard != 0
        with:
          node-version: 22

      - name: Architecture lint
        if: matrix.shard == 0
        run: ./tools/lint/architecture-lint.sh

      - name: Run pure regression test suite
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          suites=$(python3 tools/ci/pure-test-shards.py "$SHARD")
          test -n "$suites"
          selected=()
          while IFS= read -r suite; do selected+=("$suite"); done <<< "$suites"
          ./tools/tests/run.sh --tier pure "${selected[@]}"

  hosted-build:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      XCODE_XCCONFIG_FILE: ${{ github.workspace }}/tools/ci/hosted-tests.xcconfig
    steps:
      - uses: actions/checkout@v4
      - name: Identify Xcode
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore hosted build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/MarkViewHostedData
          key: markview-hosted-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-${{ hashFiles('MarkView/**', 'MarkViewHostedTests/**', 'Packages/MarkViewCore/**', 'MarkView.xcodeproj/**', 'tools/tests/*.swift', 'tools/ci/hosted-tests.xcconfig', '!Packages/MarkViewCore/.build/**') }}
          restore-keys: |
            markview-hosted-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-
      - name: Restore unchanged hosted build input timestamps
        run: python3 tools/ci/build-cache-mtimes.py restore "$RUNNER_TEMP/MarkViewHostedData/source-mtimes.json"
      - name: Build app and hosted tests once
        run: |
          xcodebuild -project MarkView.xcodeproj -scheme MarkView -configuration HostedTests \
            -derivedDataPath "$RUNNER_TEMP/MarkViewHostedData" CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Record hosted build input timestamps
        run: python3 tools/ci/build-cache-mtimes.py save "$RUNNER_TEMP/MarkViewHostedData/source-mtimes.json"
      - name: Save hosted build cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/MarkViewHostedData
          key: ${{ steps.cache.outputs.cache-primary-key }}

  hosted-tests:
    runs-on: macos-latest
    timeout-minutes: 25
    needs: hosted-build
    env:
      XCODE_XCCONFIG_FILE: ${{ github.workspace }}/tools/ci/hosted-tests.xcconfig
    strategy:
      fail-fast: false
      matrix:
        suite: [qa-general-pair, qa-isolated, qa-editor-pair-01, qa-editor-pair-23, terminal-host-tests, workflow-editor-layout-tests, web-pair, ui-studio-web-tests, welcome-screen-tests, project-ai-choice-tests, studio-pair, studio-network]
    steps:
      - uses: actions/checkout@v4
      - name: Identify Xcode
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore hosted build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/MarkViewHostedData
          key: markview-hosted-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-${{ hashFiles('MarkView/**', 'MarkViewHostedTests/**', 'Packages/MarkViewCore/**', 'MarkView.xcodeproj/**', 'tools/tests/*.swift', 'tools/ci/hosted-tests.xcconfig', '!Packages/MarkViewCore/.build/**') }}
          restore-keys: |
            markview-hosted-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-
      - name: Restore unchanged hosted build input timestamps
        run: python3 tools/ci/build-cache-mtimes.py restore "$RUNNER_TEMP/MarkViewHostedData/source-mtimes.json"
      - name: Run app-hosted regression suite
        env:
          MARKVIEW_HOSTED_TEST_DERIVED_DATA: ${{ runner.temp }}/MarkViewHostedData
          HOSTED_SUITE: ${{ matrix.suite }}
        run: |
          export MARKVIEW_PREBUILT_HOSTED=1
          export PATH="$PWD/tools/ci:$PATH"
          case "$HOSTED_SUITE" in
            qa-general-pair) tools/ci/run-hosted-pair.sh qa-general-0 qa-general-1 ;;
            qa-editor-pair-01) tools/ci/run-hosted-pair.sh qa-editor-0 qa-editor-1 ;;
            qa-editor-pair-23) tools/ci/run-hosted-pair.sh qa-editor-2 qa-editor-3 ;;
            web-pair) tools/ci/run-hosted-pair.sh theme-web-tests research-map-web-tests ;;
            studio-pair) tools/ci/run-hosted-pair.sh studio-session studio-recovery ;;
            studio-*) MARKVIEW_STUDIO_TEST_PART="${HOSTED_SUITE#studio-}" ./tools/tests/run.sh ui-studio-session-tests ;;
            qa-editor-*|qa-general-*|qa-isolated) MARKVIEW_QA_HOST_PART="${HOSTED_SUITE#qa-}" ./tools/tests/run.sh qa-web-fault-tests ;;
            *) ./tools/tests/run.sh "$HOSTED_SUITE" ;;
          esac
  backdrop-tests:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      XCODE_XCCONFIG_FILE: ${{ github.workspace }}/tools/ci/hosted-tests.xcconfig
    steps:
      - uses: actions/checkout@v4
      - name: Identify Xcode
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore backdrop fixture build cache
        id: backdrop-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/MarkViewBackdropData
          key: markview-backdrop-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-${{ hashFiles('MarkView/**', 'MarkViewHostedTests/**', 'Packages/MarkViewCore/**', 'MarkView.xcodeproj/**', 'tools/tests/*.swift', 'tools/tests/backdrop-registry-tests.sh', 'tools/ci/hosted-tests.xcconfig', '!Packages/MarkViewCore/.build/**') }}
          restore-keys: |
            markview-backdrop-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-
      - name: Restore unchanged fixture input timestamps
        run: python3 tools/ci/build-cache-mtimes.py restore "$RUNNER_TEMP/MarkViewBackdropData/source-mtimes.json"
      - name: Run backdrop runtime-discovery test
        env:
          MARKVIEW_BACKDROP_HOSTED_DERIVED_DATA: ${{ runner.temp }}/MarkViewBackdropData
        run: ./tools/tests/run.sh backdrop-registry-tests
      - name: Record backdrop fixture input timestamps
        run: python3 tools/ci/build-cache-mtimes.py save "$RUNNER_TEMP/MarkViewBackdropData/source-mtimes.json"
      - name: Save backdrop fixture build cache
        if: ${{ steps.backdrop-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/MarkViewBackdropData
          key: ${{ steps.backdrop-cache.outputs.cache-primary-key }}

  build:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Swift package build cache
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: Packages/MarkViewCore/.build
          key: markview-swiftpm-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-${{ hashFiles('Packages/MarkViewCore/**', '!Packages/MarkViewCore/.build/**') }}
          restore-keys: |
            markview-swiftpm-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-

      - name: Restore unchanged Swift package input timestamps
        run: python3 tools/ci/build-cache-mtimes.py restore Packages/MarkViewCore/.build/source-mtimes.json

      - name: Run MarkViewCore Swift Package tests
        run: |
          set -o pipefail
          swift test --package-path Packages/MarkViewCore 2>&1 | tee "$RUNNER_TEMP/package-build.log"

      - name: Record Swift package input timestamps
        run: python3 tools/ci/build-cache-mtimes.py save Packages/MarkViewCore/.build/source-mtimes.json

      - name: Save Swift package build cache
        if: ${{ steps.package-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: Packages/MarkViewCore/.build
          key: ${{ steps.package-cache.outputs.cache-primary-key }}

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/MarkViewDerivedData
          key: markview-debug-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-${{ hashFiles('MarkView/**', 'Packages/MarkViewCore/**', 'MarkView.xcodeproj/**', '!Packages/MarkViewCore/.build/**') }}
          restore-keys: |
            markview-debug-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-

      - name: Restore unchanged build input timestamps
        run: python3 tools/ci/build-cache-mtimes.py restore "$RUNNER_TEMP/MarkViewDerivedData/source-mtimes.json"

      - name: Prepare changed sources for analyzer
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_COMMIT" ] || [ "$BASE_COMMIT" = 0000000000000000000000000000000000000000 ]; then
            BASE_COMMIT=HEAD^
          fi
          python3 tools/ci/unused-import-changes.py --base "$BASE_COMMIT" --prepare

      - name: Build MarkView (Debug)
        run: |
          set -o pipefail
          xcodebuild -project MarkView.xcodeproj \
            -scheme MarkView \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/MarkViewDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/app-build.log"

      - name: Build warnings ratchet
        run: ./tools/lint/build-warnings.sh --log "$RUNNER_TEMP/app-build.log" --log "$RUNNER_TEMP/package-build.log"

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint ratchet
        run: ./tools/lint/swiftlint-ratchet.py

      - name: Check unused imports in changed and bounded recompiled sources
        timeout-minutes: 35
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_COMMIT" ] || [ "$BASE_COMMIT" = 0000000000000000000000000000000000000000 ]; then
            BASE_COMMIT=HEAD^
          fi
          python3 tools/ci/unused-import-changes.py --base "$BASE_COMMIT" --compiler-log "$RUNNER_TEMP/app-build.log"

      - name: Record build input timestamps
        run: python3 tools/ci/build-cache-mtimes.py save "$RUNNER_TEMP/MarkViewDerivedData/source-mtimes.json"

      - name: Save build cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/MarkViewDerivedData
          key: ${{ steps.cache.outputs.cache-primary-key }}
