name: UI Studio Checks
on:
  pull_request:
    paths:
      - 'MarkView/Models/UIStudio*.swift'
      - 'MarkView/Views/UIStudio*.swift'
      - 'MarkView/Models/ImageAttachments.swift'
      - 'MarkView/Models/WebAppPreview.swift'
      - 'MarkView/Models/FrontMatter.swift'
      - 'MarkView/Models/BrowserElementPick.swift'
      - 'MarkView/Resources/Editor/vendor/js/markview-ui-studio.js'
      - 'tools/tests/UIStudio*'
      - 'tools/tests/ui-studio*.sh'
      - 'tools/tests/studio-python/**'
      - 'tools/tests/ImageAttachments*'
      - 'tools/tests/image-attachments-tests.sh'
      - '.github/workflows/ui-studio.yml'
permissions:
  contents: read
jobs:
  ui-studio:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/cockpit-temporal/go.mod
          cache-dependency-path: tools/cockpit-temporal/go.sum
      - name: Check the images of a request box (limits, PNG, pasteboard, drop, file name, paste at the caret)
        run: bash tools/tests/image-attachments-tests.sh
      - name: Check simulation, rule preparation, redaction, bridge, changes and undo, scenarios, evidence, selection and processes
        run: bash tools/tests/ui-studio-tests.sh
      - name: Run the page runtime in WebKit (requests, clock, selection, zoom, replay, connection policy)
        run: bash tools/tests/ui-studio-web-tests.sh
        timeout-minutes: 8
      - name: Run a session against a real development server
        run: bash tools/tests/ui-studio-session-tests.sh
        timeout-minutes: 12
      - name: Build application
        run: xcodebuild -project MarkView.xcodeproj -scheme MarkView -configuration Debug -derivedDataPath /tmp/MarkViewUIStudioCI CODE_SIGNING_ALLOWED=NO build
