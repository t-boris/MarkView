name: Copilot Cockpit Checks

on:
  push:
    branches: [main]
    paths:
      - 'MarkView/Models/Cockpit/*.swift'
      - 'Packages/MarkViewCore/Sources/MarkViewCore/FeatureReviewGate.swift'
      - 'MarkView/Models/QA/QARunCleanup.swift'
      - 'tools/cockpit-temporal/**'
      - 'tools/tests/Cockpit*'
      - 'MarkViewHostedTests/CockpitRuntimeIntegrationHostTests.swift'
      - 'tools/tests/cockpit-*.sh'
      - 'tools/tests/cockpit-*.py'
      - 'Packages/MarkViewCore/Tests/MarkViewCoreTests/FeatureReviewGateTests.swift'
      - '.github/workflows/copilot-cockpit.yml'
  pull_request:
    paths:
      - 'MarkView/Models/Cockpit/*.swift'
      - 'Packages/MarkViewCore/Sources/MarkViewCore/FeatureReviewGate.swift'
      - 'MarkView/Models/QA/QARunCleanup.swift'
      - 'tools/cockpit-temporal/**'
      - 'tools/tests/Cockpit*'
      - 'MarkViewHostedTests/CockpitRuntimeIntegrationHostTests.swift'
      - 'tools/tests/cockpit-*.sh'
      - 'tools/tests/cockpit-*.py'
      - 'Packages/MarkViewCore/Tests/MarkViewCoreTests/FeatureReviewGateTests.swift'
      - '.github/workflows/copilot-cockpit.yml'

concurrency:
  group: copilot-cockpit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cockpit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Identify Xcode
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore hosted build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/MarkViewHostedData
          key: markview-hosted-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-${{ hashFiles('MarkView/**', 'MarkViewHostedTests/**', 'Packages/MarkViewCore/**', 'MarkView.xcodeproj/**', 'tools/tests/*.swift') }}
          restore-keys: |
            markview-hosted-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-
      - name: Restore unchanged hosted build input timestamps
        run: python3 tools/ci/build-cache-mtimes.py restore "$RUNNER_TEMP/MarkViewHostedData/source-mtimes.json"
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/cockpit-temporal/go.mod
          cache-dependency-path: tools/cockpit-temporal/go.sum
      - name: Check planning, approval, recovery and QA retention
        run: |
          ( tools/tests/cockpit-build-phase-tests.sh ) & a=$!
          # Cockpit QA-attempt checks run with the shipping app in CI's hosted suite.
          ( swift test --package-path Packages/MarkViewCore --filter FeatureReviewGateTests; ./tools/lint/architecture-lint.sh ) & c=$!
          status=0
          for job in "$a" "$c"; do wait "$job" || status=1; done
          exit "$status"
      - name: Check Temporal workflow
        working-directory: tools/cockpit-temporal
        run: go test ./...
      - name: Build and check the local runtime
        env:
          MARKVIEW_HOSTED_TEST_DERIVED_DATA: ${{ runner.temp }}/MarkViewHostedData
        run: |
          export TARGET_BUILD_DIR="$RUNNER_TEMP/cockpit-product"
          export UNLOCALIZED_RESOURCES_FOLDER_PATH="MarkView.app/Contents/Resources"
          export CONFIGURATION=Debug
          tools/cockpit-temporal/scripts/build-runtime.sh
          [ "$(uname -m)" = arm64 ] || { echo 'An Apple Silicon runner is required'; exit 1; }
          export MARKVIEW_TEST_RUNTIME="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Cockpit/arm64"
          MARKVIEW_TEST_WATCHDOG="$MARKVIEW_TEST_RUNTIME/bin/terminal-watchdog" python3 tools/tests/cockpit-watchdog-tests.py
          tools/tests/cockpit-runtime-integration-tests.sh
