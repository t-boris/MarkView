name: Copilot Cockpit Checks

on:
  push:
    branches: [main]
    paths:
      - 'MarkView/Models/Cockpit*.swift'
      - 'MarkView/Models/FeatureReviewGate.swift'
      - 'MarkView/Models/QARunCleanup.swift'
      - 'tools/cockpit-temporal/**'
      - 'tools/tests/Cockpit*'
      - 'tools/tests/cockpit-*.sh'
      - 'tools/tests/FeatureReviewGateChecks.swift'
      - 'tools/tests/feature-review-gate-tests.sh'
      - 'tools/tests/QARetentionChecks.swift'
      - 'tools/tests/qa-retention-tests.sh'
      - '.github/workflows/copilot-cockpit.yml'
  pull_request:
    paths:
      - 'MarkView/Models/Cockpit*.swift'
      - 'MarkView/Models/FeatureReviewGate.swift'
      - 'MarkView/Models/QARunCleanup.swift'
      - 'tools/cockpit-temporal/**'
      - 'tools/tests/Cockpit*'
      - 'tools/tests/cockpit-*.sh'
      - 'tools/tests/FeatureReviewGateChecks.swift'
      - 'tools/tests/feature-review-gate-tests.sh'
      - 'tools/tests/QARetentionChecks.swift'
      - 'tools/tests/qa-retention-tests.sh'
      - '.github/workflows/copilot-cockpit.yml'

permissions:
  contents: read

jobs:
  cockpit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/cockpit-temporal/go.mod
          cache-dependency-path: tools/cockpit-temporal/go.sum
      - name: Check planning, approval, recovery and QA retention
        run: |
          tools/tests/cockpit-plan-tests.sh
          tools/tests/cockpit-planning-tests.sh
          tools/tests/cockpit-run-tests.sh
          tools/tests/cockpit-host-bridge-tests.sh
          tools/tests/cockpit-child-tests.sh
          tools/tests/cockpit-agent-registry-tests.sh
          tools/tests/feature-review-gate-tests.sh
          tools/tests/qa-retention-tests.sh
      - name: Check Temporal workflow
        working-directory: tools/cockpit-temporal
        run: go test ./...
      - name: Build and check the local runtime
        run: |
          export TARGET_BUILD_DIR="$RUNNER_TEMP/cockpit-product"
          export UNLOCALIZED_RESOURCES_FOLDER_PATH="MarkView.app/Contents/Resources"
          export CONFIGURATION=Debug
          tools/cockpit-temporal/scripts/build-runtime.sh
          case "$(uname -m)" in arm64) arch=arm64 ;; x86_64) arch=amd64 ;; *) exit 1 ;; esac
          export MARKVIEW_TEST_RUNTIME="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Cockpit/$arch"
          export MARKVIEW_TEST_SERVER="$MARKVIEW_TEST_RUNTIME/bin/server"
          export MARKVIEW_TEST_POSTGRES="$MARKVIEW_TEST_RUNTIME/postgres"
          export MARKVIEW_TEST_SUPERVISOR="$MARKVIEW_TEST_RUNTIME/bin/postgres-supervisor"
          (cd tools/cockpit-temporal && go test -p 2 -tags integration -timeout 180s -run TestLocalTemporalStartsAndRestarts ./localserver)
          tools/tests/cockpit-runtime-integration-tests.sh
