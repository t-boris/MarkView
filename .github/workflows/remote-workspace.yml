name: Remote Workspace Checks

on:
  pull_request:
    paths:
      - 'MarkView/Models/Remote/**'
      - 'MarkView/Models/TerminalSession.swift'
      - 'tools/remote-relay/**'
      - 'tools/tests/Remote*'
      - 'tools/tests/remote-workspace-tests.sh'
      - '.github/workflows/remote-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Redis command client for isolated integration checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-tools
      - name: Verify durable queues against real Redis
        env:
          REDIS_TEST_PORT: '6379'
        run: node --test tools/remote-relay/*.test.mjs
  workspace-and-relay:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check work-computer files, commands, encryption, HTTPS and the live Unix bridge
        run: bash tools/tests/remote-workspace-tests.sh
      - name: Build macOS application
        run: >-
          xcodebuild -project MarkView.xcodeproj -scheme MarkView -configuration Debug
          -derivedDataPath /tmp/MarkViewRemoteCI CODE_SIGNING_ALLOWED=NO build
