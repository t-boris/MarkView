name: Remote Workspace Checks

on:
  pull_request:
    paths:
      - 'MarkView/Models/Remote/**'
      - 'MarkView/Models/Terminal/TerminalSession.swift'
      - 'MarkView/Models/Terminal/TerminalChildProcess.swift'
      - 'MarkView/Models/Git/GitHubClient.swift'
      - 'MarkView/Models/AgentTools/BrowserAgentTools.swift'
      - 'MarkView/Models/Browser/BrowserControlServer.swift'
      - 'tools/remote-relay/**'
      - 'tools/ci/hosted-tests.xcconfig'
      - 'tools/tests/Remote*'
      - 'tools/tests/SavedRemote*'
      - 'tools/tests/PersistentRemote*'
      - 'tools/tests/saved-remote-connections-host-tests.sh'
      - 'Tests/Fixtures/saved-remote-relay.py'
      - 'Tests/Fixtures/assistant-persistent-echo.sh'
      - 'tools/tests/persistent-remote*'
      - 'tools/tests/remote-workspace-tests.sh'
      - 'tools/tests/remote-workspace-host-tests.sh'
      - 'tools/tests/remote-relay-tests.sh'
      - 'MarkViewHostedTests/RemoteWorkspaceHostTests.swift'
      - 'MarkViewHostedTests/RemoteRelaySettingsHostTests.swift'
      - 'MarkViewHostedTests/GitHubRemoteProfileHostTests.swift'
      - 'MarkViewHostedTests/RemoteCodexContextHostTests.swift'
      - 'MarkViewHostedTests/RemoteChannelHostTests.swift'
      - 'tools/tests/remote-browser-tests.sh'
      - 'tools/tests/remote-relay-settings-tests.sh'
      - '.github/workflows/remote-workspace.yml'
  workflow_dispatch:

concurrency:
  group: remote-workspace-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  durable-relay:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Redis command client for isolated integration checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-tools
      - name: Verify durable queues against real Redis
        env:
          REDIS_TEST_PORT: '6379'
        run: node --test tools/remote-relay/*.test.mjs
  workspace-and-relay:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      XCODE_XCCONFIG_FILE: ${{ github.workspace }}/tools/ci/hosted-tests.xcconfig
    steps:
      - uses: actions/checkout@v4
      - name: Identify Xcode
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore hosted build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/MarkViewHostedData
          key: markview-hosted-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-${{ hashFiles('MarkView/**', 'MarkViewHostedTests/**', 'Packages/MarkViewCore/**', 'MarkView.xcodeproj/**', 'tools/tests/*.swift', 'tools/ci/hosted-tests.xcconfig', '!Packages/MarkViewCore/.build/**') }}
          restore-keys: |
            markview-hosted-${{ runner.os }}-arm64-${{ steps.xcode.outputs.version }}-
      - name: Restore unchanged hosted build input timestamps
        run: python3 tools/ci/build-cache-mtimes.py restore "$RUNNER_TEMP/MarkViewHostedData/source-mtimes.json"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check work-computer files, commands, encryption, HTTPS and the live Unix bridge
        env:
          MARKVIEW_HOSTED_TEST_DERIVED_DATA: ${{ runner.temp }}/MarkViewHostedData
        run: bash tools/tests/remote-workspace-tests.sh
      - name: Verify saved Keychain pairings and reconnecting concurrent sessions
        env:
          MARKVIEW_HOSTED_TEST_DERIVED_DATA: ${{ runner.temp }}/MarkViewHostedData
        run: |
          bash tools/tests/saved-remote-connections-host-tests.sh
          bash tools/tests/persistent-remote-host-tests.sh
